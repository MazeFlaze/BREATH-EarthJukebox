name: BREATHE Continuous Integration & Continuous Deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target component to deploy (backend / both)'
        required: false
        default: 'backend'

permissions:
  contents: read
  id-token: write

concurrency:
  group: breathe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-ci:
    name: Backend Test Suite (FastAPI & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for Python/browser numeric parity tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System C-Libraries for NetCDF4 & HDF5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnetcdf-dev libhdf5-dev

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          uv pip install --system -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: src:.
        run: |
          pytest -v tests/

  frontend-ci:
    name: Frontend Checks (Lint, Typecheck, Tests & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Lint & Typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Run Frontend Unit Tests
        run: npm run test:contracts

      - name: Run Scientific Audio and Contract Parity Tests
        run: npm run test:demo

      - name: Build Production Next.js Bundle
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  deploy-backend:
    name: CD - Deploy Backend to Azure Container Apps (Scale-to-Zero)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend-ci]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Azure Configuration Secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ] || [ -z "${{ secrets.ACR_LOGIN_SERVER }}" ]; then
            echo "::warning ::Azure secrets are not fully configured. Skipping production deployment."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Azure
        if: steps.check-secrets.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        if: steps.check-secrets.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        if: steps.check-secrets.outputs.configured == 'true'
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Backend Image to ACR
        if: steps.check-secrets.outputs.configured == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/breathe-backend:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/breathe-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Provision or Update Backend Container App
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-breathe' }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "=========================================================="
          echo " Deploying Backend to Azure Container Apps"
          echo " Resource Group: ${RESOURCE_GROUP}"
          echo " ACR:            ${ACR_LOGIN_SERVER}"
          echo " Tag:            ${IMAGE_TAG}"
          echo "=========================================================="

          az extension add --name containerapp --upgrade --yes

          # Resolve effective CORS_ORIGINS (custom vars override OR auto-discover existing frontend FQDN)
          EFFECTIVE_CORS="${CORS_ORIGINS}"
          if [ -z "$EFFECTIVE_CORS" ]; then
            EXISTING_FE_FQDN=$(az containerapp show --name breathe-frontend --resource-group "${RESOURCE_GROUP}" --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || echo "")
            if [ -n "$EXISTING_FE_FQDN" ]; then
              EFFECTIVE_CORS="https://${EXISTING_FE_FQDN},http://localhost:3000,http://127.0.0.1:3000"
            else
              EFFECTIVE_CORS="http://localhost:3000,http://127.0.0.1:3000"
            fi
          fi

          # Determine location from ACR or Resource Group (ensuring allowed region such as eastasia)
          LOCATION="${{ vars.AZURE_LOCATION }}"
          if [ -z "$LOCATION" ]; then
            LOCATION=$(az acr show --name "${ACR_LOGIN_SERVER%%.*}" --query location -o tsv 2>/dev/null || echo "")
          fi
          if [ -z "$LOCATION" ] || [ "$LOCATION" = "southeastasia" ]; then
            LOCATION="eastasia"
          fi
          echo " Target Location: ${LOCATION}"

          ENVIRONMENT_NAME="cae-breathe"

          # 1. Ensure Container Apps Managed Environment exists
          EXISTING_ENV=$(az containerapp env list --resource-group "${RESOURCE_GROUP}" --query "[0].name" -o tsv 2>/dev/null || echo "")
          if [ -n "$EXISTING_ENV" ]; then
            ENVIRONMENT_NAME="$EXISTING_ENV"
            echo "Reusing existing Container Apps Environment: ${ENVIRONMENT_NAME}"
          else
            ENVIRONMENT_NAME="cae-breathe"
            echo "Creating Container Apps Environment: ${ENVIRONMENT_NAME} in ${LOCATION}..."
            az containerapp env create \
              --name "${ENVIRONMENT_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --location "${LOCATION}" \
              --logs-destination none \
              --output table
          fi

          # 2. Ensure Azure Storage Account & File Share for verified GEOS-CF catalog
          CATALOG_SHARE_NAME="geos-cf-catalog"
          CATALOG_MOUNT_PATH="/app/data/geos-cf-catalog"
          CATALOG_STORAGE_READY="false"
          ENV_LOCATION=$(az containerapp env show --name "${ENVIRONMENT_NAME}" --resource-group "${RESOURCE_GROUP}" --query location -o tsv 2>/dev/null || echo "${LOCATION}")
          if STORAGE_ACCOUNT=$(bash ./scripts/ensure-azure-catalog-storage.sh "${RESOURCE_GROUP}" "${ENV_LOCATION}" "${CATALOG_SHARE_NAME}"); then
            STORAGE_KEY=$(az storage account keys list --account-name "${STORAGE_ACCOUNT}" --resource-group "${RESOURCE_GROUP}" --query "[0].value" -o tsv)
            if az containerapp env storage set \
              --name "${ENVIRONMENT_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --storage-name "${CATALOG_SHARE_NAME}" \
              --azure-file-account-name "${STORAGE_ACCOUNT}" \
              --azure-file-account-key "${STORAGE_KEY}" \
              --azure-file-share-name "${CATALOG_SHARE_NAME}" \
              --access-mode ReadOnly \
              --output none; then
              CATALOG_STORAGE_READY="true"
            fi
          fi
          if [ "${CATALOG_STORAGE_READY}" != "true" ]; then
            echo "::warning ::Could not provision Azure File Share '${CATALOG_SHARE_NAME}' in '${RESOURCE_GROUP}'. Deploying backend without catalog mount (register Microsoft.Storage or set vars.AZURE_STORAGE_ACCOUNT and re-run)."
          fi

          # 3. Deploy or Update Backend Container App (Scale-to-Zero: min-replicas 0)
          BACKEND_APP="breathe-backend"
          BACKEND_IMAGE="${ACR_LOGIN_SERVER}/${BACKEND_APP}:${IMAGE_TAG}"
          echo "Deploying Backend Container App (${BACKEND_APP})..."

          if az containerapp show --name "${BACKEND_APP}" --resource-group "${RESOURCE_GROUP}" > /dev/null 2>&1; then
            echo "Updating existing Backend Container App..."
            az containerapp update \
              --name "${BACKEND_APP}" \
              --resource-group "${RESOURCE_GROUP}" \
              --image "${BACKEND_IMAGE}" \
              --set-env-vars \
                DATABASE_URL="${DATABASE_URL}" \
                DATABASE_URL_UNPOOLED="${DATABASE_URL_UNPOOLED}" \
                CORS_ORIGINS="${EFFECTIVE_CORS}" \
                HOST="0.0.0.0" \
                PORT="8000" \
                ENVIRONMENT="production" \
                DEBUG="False" \
                GEOS_CF_CATALOG_ROOT="${CATALOG_MOUNT_PATH}"
          else
            echo "Creating new Backend Container App with scale-to-zero..."
            az containerapp create \
              --name "${BACKEND_APP}" \
              --resource-group "${RESOURCE_GROUP}" \
              --environment "${ENVIRONMENT_NAME}" \
              --image "${BACKEND_IMAGE}" \
              --registry-server "${ACR_LOGIN_SERVER}" \
              --registry-username "${ACR_USERNAME}" \
              --registry-password "${ACR_PASSWORD}" \
              --target-port 8000 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 2 \
              --cpu 0.5 \
              --memory 1.0Gi \
              --env-vars \
                DATABASE_URL="${DATABASE_URL}" \
                DATABASE_URL_UNPOOLED="${DATABASE_URL_UNPOOLED}" \
                CORS_ORIGINS="${EFFECTIVE_CORS}" \
                HOST="0.0.0.0" \
                PORT="8000" \
                ENVIRONMENT="production" \
                DEBUG="False" \
                GEOS_CF_CATALOG_ROOT="${CATALOG_MOUNT_PATH}"
          fi

          # Ensure ReadOnly Azure File Share volume mount stays attached on breathe-backend when storage is provisioned
          if [ "${CATALOG_STORAGE_READY}" = "true" ]; then
          BACKEND_JSON=$(mktemp /tmp/breathe-backend-app-XXXXXX.json)
          CATALOG_PATCH_YAML=$(mktemp /tmp/breathe-backend-mount-XXXXXX.yaml)
          trap 'rm -f "${BACKEND_JSON}" "${CATALOG_PATCH_YAML}"' EXIT
          az containerapp show --name "${BACKEND_APP}" --resource-group "${RESOURCE_GROUP}" -o json > "${BACKEND_JSON}"
          export CATALOG_SHARE_NAME CATALOG_MOUNT_PATH
          NEEDS_MOUNT=$(python3 -c '
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as src_fh:
              app = json.load(src_fh)
          props = app.get("properties") or {}
          template = props.get("template") or {}
          share = os.environ["CATALOG_SHARE_NAME"]
          mount_path = os.environ["CATALOG_MOUNT_PATH"]
          volumes = template.get("volumes") or []
          containers = template.get("containers") or []
          mounts = containers[0].get("volumeMounts") or [] if containers else []
          has_vol = any(v.get("name") == share and v.get("storageName") == share and v.get("storageType") == "AzureFile" for v in volumes)
          has_mnt = any(m.get("volumeName") == share and m.get("mountPath") == mount_path for m in mounts)
          if has_vol and has_mnt:
              print("no")
              sys.exit(0)
          new_volumes = [v for v in volumes if v.get("name") != share]
          new_volumes.append({"name": share, "storageType": "AzureFile", "storageName": share})
          template["volumes"] = new_volumes
          new_mounts = [m for m in mounts if m.get("volumeName") != share and m.get("mountPath") != mount_path]
          new_mounts.append({"volumeName": share, "mountPath": mount_path})
          containers[0]["volumeMounts"] = new_mounts
          payload = {
              "properties": {
                  "managedEnvironmentId": props["managedEnvironmentId"],
                  "template": {k: v for k, v in template.items() if k != "revisionSuffix" and v is not None},
              }
          }
          with open(sys.argv[2], "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2)
          print("yes")
          ' "${BACKEND_JSON}" "${CATALOG_PATCH_YAML}")
          if [ "${NEEDS_MOUNT}" = "yes" ]; then
            echo "Attaching ReadOnly Azure File Share (${CATALOG_SHARE_NAME} -> ${CATALOG_MOUNT_PATH})..."
            az containerapp update \
              --name "${BACKEND_APP}" \
              --resource-group "${RESOURCE_GROUP}" \
              --yaml "${CATALOG_PATCH_YAML}" \
              --output none
          else
            echo "Verified catalog volume mount (${CATALOG_MOUNT_PATH}) already attached."
          fi
          else
            echo "Skipping Azure File Share volume mount patch because catalog storage was not provisioned."
          fi

          BACKEND_FQDN=$(az containerapp show --name "${BACKEND_APP}" --resource-group "${RESOURCE_GROUP}" --query properties.configuration.ingress.fqdn -o tsv)

          echo "=========================================================="
          echo " Backend Deployment to Azure Container Apps completed!"
          echo " Backend API:         https://${BACKEND_FQDN}"
          echo " Backend Healthcheck: https://${BACKEND_FQDN}/api/v1/health"
          echo " OpenAPI Docs:        https://${BACKEND_FQDN}/docs"
          echo "=========================================================="

          # Write summary to GitHub Actions job summary
          echo "### 🚀 Azure Backend Deployment Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend API:** [https://${BACKEND_FQDN}](https://${BACKEND_FQDN})" >> $GITHUB_STEP_SUMMARY
          echo "- **Healthcheck:** [https://${BACKEND_FQDN}/api/v1/health](https://${BACKEND_FQDN}/api/v1/health)" >> $GITHUB_STEP_SUMMARY
          echo "- **OpenAPI Docs:** [https://${BACKEND_FQDN}/docs](https://${BACKEND_FQDN}/docs)" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${BACKEND_IMAGE}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Scale Policy:** \`minReplicas=0\` (Scale-to-Zero on idle)" >> $GITHUB_STEP_SUMMARY

  # Frontend CD deploys to Azure Container Apps when ENABLE_FRONTEND_DEPLOY == 'true'
  # or when manually triggered via workflow_dispatch with deploy_target == 'both'.
  deploy-frontend:
    name: CD - Deploy Frontend to Azure Container Apps
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (vars.ENABLE_FRONTEND_DEPLOY == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'both'))
    needs: [backend-ci, frontend-ci, deploy-backend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Azure Configuration Secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ] || [ -z "${{ secrets.ACR_LOGIN_SERVER }}" ]; then
            echo "::warning ::Azure secrets are not fully configured. Skipping frontend production deployment."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Azure
        if: steps.check-secrets.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        if: steps.check-secrets.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        if: steps.check-secrets.outputs.configured == 'true'
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Frontend Image
        if: steps.check-secrets.outputs.configured == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL || '' }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '' }}
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/breathe-frontend:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/breathe-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Frontend Container App
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-breathe' }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          az extension add --name containerapp --upgrade --yes
          EXISTING_ENV=$(az containerapp env list --resource-group "${RESOURCE_GROUP}" --query "[0].name" -o tsv 2>/dev/null || echo "")
          ENVIRONMENT_NAME="${EXISTING_ENV:-cae-breathe}"
          FRONTEND_APP="breathe-frontend"
          FRONTEND_IMAGE="${ACR_LOGIN_SERVER}/${FRONTEND_APP}:${IMAGE_TAG}"
          BACKEND_FQDN=$(az containerapp show --name breathe-backend --resource-group "${RESOURCE_GROUP}" --query properties.configuration.ingress.fqdn -o tsv || echo "")
          BACKEND_URL=""
          if [ -n "${BACKEND_FQDN}" ]; then
            BACKEND_URL="https://${BACKEND_FQDN}"
          fi

          if az containerapp show --name "${FRONTEND_APP}" --resource-group "${RESOURCE_GROUP}" > /dev/null 2>&1; then
            az containerapp update \
              --name "${FRONTEND_APP}" \
              --resource-group "${RESOURCE_GROUP}" \
              --image "${FRONTEND_IMAGE}" \
              --set-env-vars \
                BACKEND_API_URL="${BACKEND_URL}" \
                DATABASE_URL="${DATABASE_URL}" \
                PORT="3000" \
                NODE_ENV="production"
          else
            az containerapp create \
              --name "${FRONTEND_APP}" \
              --resource-group "${RESOURCE_GROUP}" \
              --environment "${ENVIRONMENT_NAME}" \
              --image "${FRONTEND_IMAGE}" \
              --registry-server "${ACR_LOGIN_SERVER}" \
              --registry-username "${ACR_USERNAME}" \
              --registry-password "${ACR_PASSWORD}" \
              --target-port 3000 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 3 \
              --cpu 0.5 \
              --memory 1.0Gi \
              --env-vars \
                BACKEND_API_URL="${BACKEND_URL}" \
                DATABASE_URL="${DATABASE_URL}" \
                PORT="3000" \
                NODE_ENV="production"
          fi

          FRONTEND_FQDN=$(az containerapp show --name "${FRONTEND_APP}" --resource-group "${RESOURCE_GROUP}" --query properties.configuration.ingress.fqdn -o tsv)
          echo "=========================================================="
          echo " Frontend Deployment to Azure Container Apps completed!"
          echo " Frontend URL:      https://${FRONTEND_FQDN}"
          echo " Proxy Healthcheck: https://${FRONTEND_FQDN}/api/v1/health"
          echo "=========================================================="

          echo "### 🌐 Azure Frontend Deployment Succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Frontend App:** [https://${FRONTEND_FQDN}](https://${FRONTEND_FQDN})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Proxy Healthcheck:** [https://${FRONTEND_FQDN}/api/v1/health](https://${FRONTEND_FQDN}/api/v1/health)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Backend Upstream:** \`${BACKEND_URL:-unset}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${FRONTEND_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Scale Policy:** \`minReplicas=0\` (Scale-to-Zero on idle)" >> "$GITHUB_STEP_SUMMARY"
