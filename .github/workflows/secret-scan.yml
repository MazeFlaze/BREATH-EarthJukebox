name: Secret & Credential Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full-history audit every Monday at 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secret-scan:
    name: Gitleaks & Tracked Env Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if sensitive env or key files are tracked in Git
        run: |
          TRACKED=$(git ls-files | grep -P '(^|/)(\.env(\.(?!.*example$)[^/]+)?$|\.neon$|.*\.(pem|key|p12|pfx)$)' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error ::Sensitive local files must never be committed to Git:"
            echo "$TRACKED"
            exit 1
          fi
          echo "Tracked file guard passed (no .env*, .neon, or key files tracked)."

      - name: Cache Gitleaks binary
        id: cache-gitleaks
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-linux-x64-${{ env.GITLEAKS_VERSION }}

      - name: Install Gitleaks (verified SHA-256)
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin /tmp/gitleaks-dl
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks-dl/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks-dl/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks-dl/gitleaks.tar.gz -C ~/.local/bin gitleaks
          chmod +x ~/.local/bin/gitleaks
          rm -rf /tmp/gitleaks-dl

      - name: Verify Gitleaks version
        run: ~/.local/bin/gitleaks version

      - name: Scan Pull Request commit range and working tree
        if: github.event_name == 'pull_request'
        run: |
          ~/.local/bin/gitleaks git \
            --config .gitleaks.toml \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact \
            --no-banner
          ~/.local/bin/gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --no-banner

      - name: Scan full Git history and working tree
        if: github.event_name != 'pull_request'
        run: |
          ~/.local/bin/gitleaks git \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --no-banner
          ~/.local/bin/gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --no-banner
