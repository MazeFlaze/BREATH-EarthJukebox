[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "breathe-backend"
version = "1.0.0"
description = "NASA Space Apps Challenge 2026 – The Earth Information Jukebox Scientific Backend API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "BREATHE Space Apps Team" }
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "pandas>=2.2.0",
  "xarray>=2024.1.0",
  "netCDF4>=1.6.5",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "psycopg>=3.1.0",
  "psycopg-binary>=3.1.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "matplotlib>=3.9.0",
  "seaborn>=0.13.2",
  "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
]
